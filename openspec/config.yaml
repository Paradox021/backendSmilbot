schema: spec-driven

context: |
  Architecture: Node.js (ES Modules), Express, MongoDB (Mongoose) backend for the Smilbot Discord bot ecosystem.
  Documentation Policy: La Bóveda Centralizada de Obsidian (smilbot-vault, accesible vía el servidor MCP obsidian_vault) es la única fuente de verdad compartida para contratos de API, esquemas de base de datos y lógica de negocio.
  Siempre que se agregue o modifique un endpoint, query parameter, modelo, cálculo de negocio o comportamiento del sistema, la documentación correspondiente en la Bóveda de Obsidian DEBE actualizarse.

rules:
  proposal:
    - Always list affected Obsidian Vault notes under the Impact section.
  tasks:
    - Every change modifying or adding endpoints, database schemas, or business features MUST include an explicit task dedicated to updating documentation in the Obsidian Vault via MCP obsidian_vault.

operations:
  apply:
    guidance:
      - Always ensure all documentation tasks for the Obsidian Vault are fully completed and verified before concluding implementation.
  archive:
    guidance:
      - Confirm that the Obsidian Vault reflects all capabilities introduced by the archived change.
