schema: spec-driven

context: |
  Architecture: Node.js (ES Modules), Express, MongoDB (Mongoose) backend for the Smilbot Discord bot ecosystem.
  Documentation Policy: The `docs/` directory (specifically `docs/features/` and `docs/README.md`) is the canonical source of truth for bot commands, API contracts, database schemas, and business logic.
  Whenever any endpoint, query parameter, model schema, business calculation, or system behavior is added or modified, the corresponding documentation in `docs/` MUST be updated alongside the code changes.

rules:
  proposal:
    - Always list affected documentation files under the Impact section.
  tasks:
    - Every change modifying or adding endpoints, database schemas, or business features MUST include an explicit task dedicated to updating `docs/features/` and `docs/README.md`.
    - Documentation tasks must specify the exact documentation files to update and the required verification.

operations:
  apply:
    guidance:
      - Always ensure all documentation tasks for `docs/` are fully completed and verified before concluding implementation.
      - Never leave newly added endpoints or fields undocumented in `docs/README.md` or feature specs.
  archive:
    guidance:
      - Confirm that docs/ reflects all capabilities introduced by the archived change.
